  <style>
:root {
  color-scheme: light;
  --page: #fff9ec;
  --ink: #243c2f;
  --muted: #655042;
  --orange-ink: #92380f;
  --green: #293e29;
  --green-deep: #182e1c;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  color: var(--ink);
  background: var(--page);
  font-synthesis: none;
  scroll-padding-top: 1rem;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 280px;
  min-height: 100vh;
  background: radial-gradient(ellipse at 49% -18%, #ffe8ad 0, transparent 71%);
}

[hidden] { display: none !important; }

a { color: inherit; text-decoration: none; }

button { font: inherit; }

button, a { -webkit-tap-highlight-color: transparent; }

button:focus-visible, a:focus-visible, h2:focus-visible {
  outline: 3px solid #985118;
  outline-offset: 5px;
}

.page-width {
  width: min(1072px, calc(100% - 80px));
  margin-inline: auto;
}

.masthead {
  min-height: 83px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand, .ticket-link {
  display: inline-flex;
  align-items: center;
  gap: .65rem;
  font-weight: 750;
}

.brand {
  font-size: 1.0625rem;
  letter-spacing: .045em;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  border: 1px solid #f3ad38;
  border-radius: 14px;
  background: #ffd167;
}

.bee {
  position: relative;
  width: 22px;
  height: 14px;
  margin-top: 5px;
  border: 1.5px solid #604120;
  border-radius: 54% 58% 53% 56%;
  background: repeating-linear-gradient(90deg, #ffe28c 0 5px, #604120 5px 8px);
  transform: rotate(-24deg);
}

.bee::before, .bee::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 11px;
  top: -9px;
  left: 1px;
  border: 1.5px solid #604120;
  border-radius: 54% 54% 30% 54%;
  background: #fff8e4;
  transform: rotate(-24deg);
}

.bee::after { left: 8px; transform: rotate(30deg); }

.ticket-link {
  min-height: 42px;
  padding: 0 14px;
  border: 1px solid #e8c789;
  border-radius: 999px;
  background: #fff9e7;
  font-size: .875rem;
}

.ticket-link:hover { background: #ffedc3; }

.ticket-symbol {
  display: inline-block;
  position: relative;
  flex: 0 0 auto;
  width: 21px;
  height: 15px;
  border: 1.6px solid currentColor;
  border-radius: 3px;
}

.ticket-symbol::after {
  content: "";
  position: absolute;
  inset: 1px 5px 1px auto;
  border-left: 1px dashed currentColor;
}

.hero {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: 53% 47%;
  align-items: center;
  min-height: 398px;
  overflow: hidden;
  border: 1px solid #efac48;
  border-radius: 30px;
  background: linear-gradient(108deg, #ffdf7e 0%, #ffcf62 58%, #fbb950 100%);
}

.hero::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0 0 0 43%;
  opacity: .76;
  background: repeating-conic-gradient(#ffecb37a 0 25%, transparent 0 50%) 0 0 / 52px 52px;
  mask-image: linear-gradient(to right, transparent, #000 43%);
  pointer-events: none;
}

.hero-copy {
  position: relative;
  z-index: 3;
  padding: 44px 0 46px clamp(36px, 6vw, 71px);
}

.hero h1 {
  margin: 0;
  font-size: clamp(2.45rem, 5.5vw, 4.375rem);
  line-height: 1.12;
  font-weight: 900;
  letter-spacing: .005em;
}

.hero h1 span {
  display: block;
  white-space: nowrap;
  margin-top: .12em;
  color: var(--orange-ink);
}

.hero-copy > p {
  margin: 19px 0 27px;
  color: #573913;
  font-size: 1rem;
  font-weight: 650;
}

.hero-copy > .no-script {
  margin: 12px 0 0;
  font-weight: 400;
}

.claim-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  padding: 14px 21px;
  min-height: 54px;
  border: 1px solid var(--green-deep);
  border-radius: 14px;
  background: var(--green);
  color: #fffbeb;
  box-shadow: 0 3px 0 var(--green-deep);
  font-size: 1rem;
  font-weight: 750;
  cursor: pointer;
  transition: background-color .16s ease, box-shadow .16s ease, transform .16s ease;
}

.claim-button:hover:enabled {
  background: #365535;
  transform: translateY(-2px);
  box-shadow: 0 5px 0 var(--green-deep);
}

.claim-button:active:enabled { transform: translateY(2px); box-shadow: 0 1px 0 var(--green-deep); }

.claim-button:disabled { cursor: wait; opacity: .76; }

.hero-picture {
  position: relative;
  height: 100%;
  min-height: 330px;
  pointer-events: none;
}

.sunburst {
  position: absolute;
  width: min(79%, 348px);
  aspect-ratio: 1;
  top: 49%;
  left: 47%;
  transform: translate(-50%, -50%);
  border: 1.5px solid #fff1bd;
  border-radius: 50%;
  box-shadow: 0 0 0 12px #ffedb552;
  background: radial-gradient(circle at 43% 41%, #fff2b6 0, #ffe69e 63%, #ffde7b 100%);
}

.kiana {
  position: absolute;
  z-index: 1;
  display: block;
  width: min(90%, 384px);
  height: 92%;
  top: 51%;
  left: 48%;
  object-fit: contain;
  transform: translate(-50%, -50%) rotate(-4deg);
  filter: drop-shadow(0 6px 1px #9c5d241e) drop-shadow(0 15px 16px #9c5d2430);
}

.sparkle {
  position: absolute;
  z-index: 2;
  display: block;
  aspect-ratio: 1;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
}

.sparkle-large {
  top: 17%;
  right: 13%;
  width: 42px;
  background: #fff9db;
  transform: rotate(12deg);
}

.sparkle-small {
  bottom: 22%;
  left: 5%;
  width: 29px;
  background: #fff7ca;
  transform: rotate(24deg);
}

.orange-slice {
  position: absolute;
  z-index: 2;
  right: 12%;
  bottom: 10%;
  width: 57px;
  aspect-ratio: 1;
  border: 3px solid #fff4d5;
  border-radius: 50%;
  background: repeating-conic-gradient(from 7deg, #ffc174 0 37deg, #fff5cb 37deg 45deg);
  box-shadow: inset 0 0 0 3px #f6a146, 0 4px 0 #b372292e;
  transform: rotate(13deg);
}

.orange-slice::after {
  content: "";
  display: block;
  position: absolute;
  inset: 41%;
  border-radius: 50%;
  background: #fff5cb;
}

.wallet {
  margin-top: 32px;
  scroll-margin-top: 12px;
}

.wallet-heading {
  margin-bottom: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.wallet h2 {
  margin: 0;
  font-size: clamp(1.3rem, 2.4vw, 1.75rem);
  line-height: 1.2;
  letter-spacing: .015em;
}

.claim-status {
  flex: 0 0 auto;
  margin: 0;
  padding: 6px 11px;
  border-radius: 999px;
  color: #70401f;
  background: #ffedcc;
  font-size: .875rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.wallet.is-claimed .claim-status {
  background: #e1edd2;
  color: #2d5126;
}

.ticket-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.coupon {
  --ticket-face: #fff1c7;
  --ticket-line: #e6bc68;
  --ticket-stub: #ffe9ac;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(111px, 28%);
  min-height: 119px;
  border: 1px solid var(--ticket-line);
  border-radius: 17px;
  background: var(--ticket-face);
}

.coupon:nth-child(2) {
  --ticket-face: #ffead7;
  --ticket-line: #e6b38d;
  --ticket-stub: #ffdfc2;
}

.coupon-main {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: clamp(12px, 2vw, 21px);
  padding: 14px 17px;
}

.fruit-medallion {
  display: grid;
  place-items: center;
  width: 61px;
  height: 61px;
  flex: 0 0 61px;
  border: 1px solid #efbe6a;
  border-radius: 50%;
  background: #fffbdf;
}

.fruit {
  position: relative;
  width: 31px;
  height: 29px;
  margin-top: 6px;
  transform: rotate(-7deg);
  border: 1.5px solid #c66b23;
  border-radius: 49% 49% 51% 50%;
  background: radial-gradient(circle at 33% 30%, #ffe394 0 7%, transparent 9%),
              radial-gradient(circle at 36% 29%, #ffca60, #f49636 72%);
  box-shadow: inset -2px -2px 0 #d96d301f;
}

.fruit::before {
  content: "";
  position: absolute;
  left: 13px;
  top: -7px;
  height: 8px;
  width: 13px;
  border: 1px solid #587347;
  border-radius: 80% 0 85% 5%;
  transform: rotate(-20deg);
  background: #84a95b;
}

.fruit::after {
  content: "";
  position: absolute;
  left: 9px;
  bottom: 5px;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #b96024;
  box-shadow: 5px 2px #c47029, 11px -3px #c47029;
  opacity: .55;
}

.coupon-main h3 {
  margin: 0 0 4px;
  font-size: clamp(1.125rem, 2.1vw, 1.375rem);
  line-height: 1.3;
  letter-spacing: .02em;
}

.coupon-main p {
  margin: 0;
  color: var(--muted);
  font-size: .875rem;
}

.coupon-main strong { color: var(--orange-ink); }

.coupon-stub {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  border-left: 1px dashed var(--ticket-line);
  border-radius: 0 16px 16px 0;
  background: var(--ticket-stub);
  padding: 11px 5px;
  color: #734621;
}

.coupon-stub::before, .coupon-stub::after {
  content: "";
  position: absolute;
  left: -9px;
  width: 15px;
  height: 8px;
  border: 1px solid var(--ticket-line);
  background: var(--page);
}

.coupon-stub::before { top: -1px; border-top: 0; border-radius: 0 0 10px 10px; }
.coupon-stub::after { bottom: -1px; border-bottom: 0; border-radius: 10px 10px 0 0; }

.coupon-state { font-size: .875rem; font-weight: 750; }

.coupon[data-claimed] .coupon-state { color: #315129; }

.coupon[data-claimed] .coupon-state::before {
  content: "";
  display: inline-block;
  vertical-align: 3px;
  width: 8px;
  height: 4px;
  margin-right: 6px;
  border: solid currentColor;
  border-width: 0 0 2px 2px;
  transform: rotate(-45deg);
}

.coupon-code {
  font-family: ui-monospace, "Courier New", monospace;
  font-size: .875rem;
  letter-spacing: -.025em;
  font-weight: 700;
  user-select: all;
  white-space: nowrap;
}

.wallet.just-claimed .coupon { animation: ticket-arrive .32s ease-out both; }
.wallet.just-claimed .coupon:nth-child(2) { animation-delay: .075s; }

@keyframes ticket-arrive {
  0% { transform: translateY(5px) scale(.98); }
  70% { transform: translateY(-2px); }
  100% { transform: none; }
}

.save-note { margin: 12px 0 0; color: var(--orange-ink); }

.redemption {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 18px 0 39px;
  padding: 15px 17px;
  border: 1px solid #cfdbbd;
  border-radius: 17px;
  background: #edf2dd;
}

.pin-disc {
  display: grid;
  place-items: center;
  width: 41px;
  height: 41px;
  flex: 0 0 41px;
  border-radius: 12px;
  background: #dce8c9;
}

.pin {
  position: relative;
  width: 14px;
  height: 14px;
  margin-bottom: 4px;
  border: 2px solid #3b5d35;
  border-radius: 50% 50% 50% 2px;
  transform: rotate(-45deg);
}

.pin::after {
  content: "";
  position: absolute;
  inset: 2.5px;
  border: 1px solid #3b5d35;
  border-radius: 50%;
}

.redemption h2 {
  margin: 0 0 2px;
  color: #486040;
  font-size: .875rem;
  font-weight: 700;
}

.redemption p {
  margin: 0;
  font-size: 1.0625rem;
  font-weight: 750;
  letter-spacing: .02em;
}

@media (max-width: 900px) {
  .page-width { width: calc(100% - 44px); }
  .hero { min-height: 344px; }
  .hero-picture { min-height: 304px; }
  .sparkle-large { width: 34px; }
  .orange-slice { width: 46px; }
}

@media (max-width: 650px) {
  .page-width { width: calc(100% - 32px); }
  .masthead { min-height: 65px; }
  .brand { gap: .5rem; font-size: .9375rem; }
  .brand-mark { width: 35px; height: 35px; flex-basis: 35px; border-radius: 11px; }
  .ticket-link { min-height: 39px; padding-inline: 11px; gap: 7px; }
  .ticket-link .ticket-symbol { width: 17px; height: 13px; }
  .hero {
    min-height: 316px;
    grid-template-columns: 60% 40%;
    border-radius: 23px;
  }
  .hero::before {
    inset-inline-start: 35%;
    background-size: 38px 38px;
  }
  .hero-copy { padding: 27px 0 28px 22px; }
  .hero h1 { font-size: clamp(1.85rem, 7.8vw, 2.8rem); }
  .hero-copy > p { margin: 14px 0 20px; font-size: .9375rem; }
  .claim-button { min-height: 48px; padding: 11px 13px; gap: 7px; font-size: .9375rem; }
  .claim-button .ticket-symbol { width: 17px; height: 13px; }
  .hero-picture { min-height: 0; }
  .sunburst { width: clamp(140px, 42vw, 255px); left: 59%; top: 43%; box-shadow: 0 0 0 7px #ffedb552; }
  .kiana {
    width: clamp(140px, 42vw, 246px);
    height: 84%;
    left: auto;
    right: 8px;
    top: 45%;
    transform: translateY(-50%) rotate(-4deg);
  }
  .sparkle-large { top: 20%; right: 10%; width: 25px; }
  .sparkle-small { display: none; }
  .orange-slice { bottom: 20%; right: 13%; width: 34px; border-width: 2px; }
  .wallet { margin-top: 24px; }
  .ticket-list { grid-template-columns: 1fr; gap: 11px; }
  .coupon { min-height: 92px; }
  .coupon-main { padding-block: 11px; }
  .fruit-medallion { width: 52px; height: 52px; flex-basis: 52px; }
  .redemption { margin-top: 15px; margin-bottom: 24px; padding: 12px 15px; }
}

@media (max-width: 370px) {
  .page-width { width: calc(100% - 24px); }
  .hero-copy { padding-inline-start: 15px; }
  .hero { min-height: 288px; }
  .hero h1 { font-size: clamp(1.55rem, 8.2vw, 1.85rem); }
  .hero-copy > p { max-width: 14rem; }
  .kiana { width: clamp(112px, 42vw, 155px); }
  .sunburst { width: clamp(120px, 41vw, 152px); left: 61%; }
  .coupon-main { padding-inline: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
  </style>
</head>

    <section class="wallet" id="tickets" aria-labelledby="wallet-title">
      <div class="wallet-heading">
        <h2 id="wallet-title" tabindex="-1">我的兑换券</h2>
        <p id="claim-status" class="claim-status" role="status" aria-atomic="true">已领 0 / 2 张</p>
      </div>
      <ul class="ticket-list" aria-label="两张脐橙兑换券">
        <li class="coupon">
          <div class="coupon-main">
            <span class="fruit-medallion" aria-hidden="true"><span class="fruit"></span></span>
            <div>
              <h3>小蜜蜂脐橙</h3>
              <p>可兑 <strong>1</strong> 颗</p>
            </div>
          </div>
          <div class="coupon-stub">
            <span class="coupon-state">待领取</span>
            <span class="coupon-code" hidden></span>
          </div>
        </li>
        <li class="coupon">
          <div class="coupon-main">
            <span class="fruit-medallion" aria-hidden="true"><span class="fruit"></span></span>
            <div>
              <h3>小蜜蜂脐橙</h3>
              <p>可兑 <strong>1</strong> 颗</p>
            </div>
          </div>
          <div class="coupon-stub">
            <span class="coupon-state">待领取</span>
            <span class="coupon-code" hidden></span>
          </div>
        </li>
      </ul>
      <p id="save-note" class="save-note" role="status" hidden>请截图保存兑换券，方便到寝室时出示。</p>
    </section>

    <aside class="redemption" aria-label="兑换备注">
      <span class="pin-disc" aria-hidden="true"><span class="pin"></span></span>
      <div>
        <h2>兑换备注</h2>
        <p>到东十一625寝室对换</p>
      </div>
    </aside>
  </main>
  <script>
"use strict";

const storageKey = "bee-orange-625-claim-v1";
const alphabet = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";

const wallet = document.querySelector("#tickets");
const walletTitle = document.querySelector("#wallet-title");
const status = document.querySelector("#claim-status");
const saveNote = document.querySelector("#save-note");
const claimButton = document.querySelector("#claim");
const claimLabel = document.querySelector("#claim-label");
const tickets = [...wallet.querySelectorAll(".coupon")].map((card, index) => ({
  card,
  serial: index + 1,
  state: card.querySelector(".coupon-state"),
  code: card.querySelector(".coupon-code"),
}));

function readClaim() {
  try {
    const stored = localStorage.getItem(storageKey);
    return /^[23456789A-HJ-NP-Z]{6}$/.test(stored) ? stored : null;
  } catch {
    return null;
  }
}

let claimCode = readClaim();

function renderClaim() {
  const isClaimed = Boolean(claimCode);
  claimLabel.textContent = isClaimed ? "查看已领兑换券" : "领取两张兑换券";
  status.textContent = isClaimed ? "已领 2 / 2 张" : "已领 0 / 2 张";
  wallet.classList.toggle("is-claimed", isClaimed);

  for (const { card, serial, state, code } of tickets) {
    card.toggleAttribute("data-claimed", isClaimed);
    state.textContent = isClaimed ? "已领取" : "待领取";
    code.textContent = isClaimed ? `XB-${claimCode}-${serial}` : "";
    code.hidden = !isClaimed;
  }
}

function issueClaim() {
  const existing = readClaim();
  if (existing) {
    claimCode = existing;
    return;
  }

  const randomBytes = crypto.getRandomValues(new Uint8Array(6));
  claimCode = Array.from(randomBytes, (byte) => alphabet[byte % alphabet.length]).join("");

  try {
    localStorage.setItem(storageKey, claimCode);
  } catch {
    // The vouchers remain usable for the current visit when storage is blocked.
    saveNote.hidden = false;
  }
}

function showTickets() {
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  walletTitle.focus({ preventScroll: true });
  wallet.scrollIntoView({ behavior: reducedMotion ? "instant" : "smooth", block: "start" });
}

claimButton.addEventListener("click", async () => {
  if (claimCode) {
    showTickets();
    return;
  }

  claimButton.disabled = true;
  try {
    // Lock across tabs when available so simultaneous clicks reuse the same claim.
    if (navigator.locks) {
      await navigator.locks.request(storageKey, issueClaim);
    } else {
      issueClaim();
    }
  } catch {
    issueClaim();
  } finally {
    claimButton.disabled = false;
  }

  renderClaim();
  wallet.classList.add("just-claimed");
  showTickets();
});

window.addEventListener("storage", (event) => {
  if (event.key === storageKey || event.key === null) {
    claimCode = readClaim();
    saveNote.hidden = true;
    if (!claimCode) wallet.classList.remove("just-claimed");
    renderClaim();
  }
});

renderClaim();
claimButton.disabled = false;
  </script>
